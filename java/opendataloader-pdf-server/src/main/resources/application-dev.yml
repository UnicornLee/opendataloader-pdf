pulsar:
    servers: pulsar://172.16.20.97:6650,172.16.20.98:6650,172.16.20.99:6650
    token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJwdWxzYXItdXNlciJ9.JKJIHQiiuVyv9TnsFQCLhobUUnycOvehU0bGe3gr5xA
    receive_topic_name: capital/pdf_parse/announcement_parse_increment
    send_topic_name: capital/pdf_parse/announcement_increment_parse_result
    count: 3
    ocr_send_topic_name: capital/pdf_parse/announcement_ocr_image_analysis_increment
    ocr_receive_topic_name: capital/pdf_parse/announcement_ocr_image_analysis_increment_result
    ocrCount: 2
    # Broker-side ack-timeout redelivery is disabled on purpose: the consumer-side
    # watchdog owns the timeout, so a slow message is never processed by several
    # consumers at once (see PulsarService).
    ack_timeout_seconds: 0
    # Max wall-clock time for one message (minutes). On expiry the message is failed
    # with jsonUrl="", acknowledged WITHOUT redelivery, its worker stack is logged,
    # and the next message is consumed. 0 disables the watchdog.
    consum_timeout_min: 40

